{% extends "base.html" %}
{% block title %}Activity Screen{% endblock %}
{% block subtitle %}Audit trail of all important actions for the logged-in user.{% endblock %}
{% block content %}
<div class="card">
  <table><thead><tr><th>Date</th><th>Activity</th></tr></thead><tbody>{% for a in activities %}<tr><td>{{ a.created_at }}</td><td>{{ a.message }}</td></tr>{% endfor %}</tbody></table>
</div>
{% endblock %}
