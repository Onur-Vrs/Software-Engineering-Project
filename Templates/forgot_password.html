{% extends "base.html" %}
{% block auth %}
<section class="login">
  <div class="card login-card">
    <h1>Finance Manager</h1>
    <p>Reset your password with your customer number and security answer.</p>
    <div class="auth-tabs">
      <a href="{{ url_for('signin') }}">Sign In</a>
      <a href="{{ url_for('signup') }}">Sign Up</a>
      <a class="active" href="{{ url_for('forgot_password') }}">Forgot Password</a>
    </div>
    <form method="post" class="stack">
      <label>Customer Number <input name="customer_number" required type="number" min="1" /></label>
      <label>Security Answer <input name="security_answer" required /></label>
      <label>New Password <input name="new_password" required type="password" /></label>
      <button class="btn">Reset Password</button>
    </form>
  </div>
</section>
{% endblock %}
